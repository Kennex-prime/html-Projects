
<!DOCTYPE html>
<html>
<body>

    <h2>Our Planet</h2>

    <canvas id="earth" width="200" height="200"
            style="border:1px solid black;">
    </canvas>

    <script>
        const canvas = document.getElementById("earth");
        const ctx = canvas.getContext("2d");

        ctx.beginPath();
        ctx.arc(100, 100, 60, 0, 2 * Math.PI);
        ctx.fillStyle = "green";
        ctx.fill();
    </script>

</body>
</html>
